<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered Safe Route Navigator (5G-enabled)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00f5d4;
            --secondary: #7b2cbf;
            --danger: #ff006e;
            --warning: #ffbe0b;
            --success: #00f5d4;
            --dark-bg: #0a0a0f;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-hover: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Exo 2', sans-serif;
            background: var(--dark-bg);
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }

        #map {
            height: 100vh;
            width: 100vw;
            z-index: 1;
        }

        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
        }

        .header {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 245, 212, 0.5);
        }

        .badge-5g {
            background: linear-gradient(135deg, var(--primary), #00b4d8);
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 10px var(--primary); }
            50% { box-shadow: 0 0 25px var(--primary), 0 0 40px var(--primary); }
        }

        .search-panel {
            position: fixed;
            top: 100px;
            left: 20px;
            z-index: 1000;
            padding: 24px;
            width: 360px;
        }

        .search-title {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 16px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.6);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            font-family: 'Exo 2', sans-serif;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 245, 212, 0.2);
        }

        .input-group input::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), #00b4d8);
            border: none;
            border-radius: 10px;
            color: #000;
            font-size: 0.9rem;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0, 245, 212, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary.loading .btn-text {
            opacity: 0;
        }

        .btn-primary .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24px;
            height: 24px;
            border: 3px solid transparent;
            border-top-color: #000;
            border-radius: 50%;
            opacity: 0;
            animation: none;
        }

        .btn-primary.loading .loader {
            opacity: 1;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .stats-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            padding: 24px;
            width: 360px;
        }

        .stat-item {
            margin-bottom: 20px;
        }

        .stat-item:last-child {
            margin-bottom: 0;
        }

        .stat-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .stat-label span:first-child {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .stat-value.high {
            color: var(--danger);
        }

        .stat-value.medium {
            color: var(--warning);
        }

        .stat-value.low {
            color: var(--success);
        }

        .progress-bar {
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .progress-fill.safety {
            background: linear-gradient(90deg, var(--success), var(--primary));
            box-shadow: 0 0 15px var(--primary);
        }

        .progress-fill.risk {
            background: linear-gradient(90deg, var(--warning), var(--danger));
            box-shadow: 0 0 15px var(--danger);
        }

        .alerts-panel {
            position: fixed;
            top: 100px;
            right: 20px;
            z-index: 1000;
            padding: 20px;
            width: 320px;
            max-height: 400px;
            overflow-y: auto;
        }

        .alert-item {
            padding: 12px;
            background: rgba(255, 0, 110, 0.1);
            border-left: 3px solid var(--danger);
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 0.8rem;
            animation: slideIn 0.3s ease;
        }

        .alert-item.new {
            animation: slideIn 0.3s ease, flash 1s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes flash {
            0%, 100% { background: rgba(255, 0, 110, 0.1); }
            50% { background: rgba(255, 0, 110, 0.3); }
        }

        .alert-time {
            font-size: 0.65rem;
            color: rgba(255,255,255,0.4);
            margin-top: 4px;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--danger);
            border-radius: 50%;
            animation: livePulse 1.5s ease-in-out infinite;
        }

        @keyframes livePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        .live-text {
            font-size: 0.7rem;
            color: var(--danger);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .route-info {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            padding: 24px;
            width: 320px;
            display: none;
        }

        .route-info.visible {
            display: block;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .route-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .route-score {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--success), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .route-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .route-stat {
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .route-stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
        }

        .route-stat-label {
            font-size: 0.65rem;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            margin-top: 4px;
        }

        .btn-recalculate {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--primary);
            border-radius: 8px;
            color: var(--primary);
            font-size: 0.8rem;
            font-weight: 600;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            margin-top: 16px;
            transition: all 0.3s ease;
        }

        .btn-recalculate:hover {
            background: var(--primary);
            color: #000;
        }

        .navigation-marker {
            position: relative;
        }

        .nav-marker-pulse {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary);
            opacity: 0.3;
            animation: navPulse 2s ease-out infinite;
        }

        @keyframes navPulse {
            0% { transform: scale(0.5); opacity: 0.5; }
            100% { transform: scale(2); opacity: 0; }
        }

        .nav-marker-icon {
            position: absolute;
            width: 30px;
            height: 30px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px var(--primary);
        }

        @keyframes markerBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .danger-zone {
            animation: dangerPulse 2s ease-in-out infinite;
        }

        @keyframes dangerPulse {
            0%, 100% { 
                fill: rgba(255, 0, 110, 0.3);
                stroke: rgba(255, 0, 110, 0.8);
            }
            50% { 
                fill: rgba(255, 0, 110, 0.5);
                stroke: rgba(255, 0, 110, 1);
            }
        }

        .risk-tooltip {
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid var(--danger);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 0.8rem;
            color: #fff;
            white-space: nowrap;
        }

        .risk-tooltip::before {
            content: '⚠️ ';
        }

        .legend {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            padding: 12px 24px;
            display: flex;
            gap: 24px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.7);
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .legend-dot.danger {
            background: var(--danger);
            box-shadow: 0 0 10px var(--danger);
        }

        .legend-dot.route {
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
        }

        @media (max-width: 768px) {
            .search-panel, .stats-panel, .alerts-panel, .route-info {
                width: calc(100vw - 40px);
                left: 20px;
                right: 20px;
            }

            .search-panel { top: 80px; }
            .stats-panel { bottom: 20px; }
            .alerts-panel { top: auto; bottom: 200px; right: 20px; left: auto; }
            .route-info { top: 350px; }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.3);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--glass-border);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <div class="header glass-panel">
        <div class="logo">SAFE ROUTE AI</div>
        <div class="badge-5g">5G</div>
    </div>

    <div class="search-panel glass-panel">
        <div class="search-title">Route Planner</div>
        <div class="input-group">
            <label>From Location</label>
            <input type="text" id="source" placeholder="Enter source address..." value="Koramangala, Bangalore">
        </div>
        <div class="input-group">
            <label>To Location</label>
            <input type="text" id="destination" placeholder="Enter destination..." value="MG Road, Bangalore">
        </div>
        <button class="btn-primary" id="findRoute" onclick="findRoute()">
            <span class="btn-text">Find Safe Route</span>
            <div class="loader"></div>
        </button>
    </div>

    <div class="stats-panel glass-panel">
        <div class="stat-item">
            <div class="stat-label">
                <span>Safety Score</span>
                <span class="stat-value low" id="safetyScoreValue">92%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill safety" id="safetyProgress" style="width: 92%"></div>
            </div>
        </div>
        <div class="stat-item">
            <div class="stat-label">
                <span>Risk Level</span>
                <span class="stat-value low" id="riskLevelValue">LOW</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill risk" id="riskProgress" style="width: 8%"></div>
            </div>
        </div>
        <div class="stat-item">
            <div class="stat-label">
                <span>Crowd Density</span>
                <span class="stat-value" id="crowdDensity">Medium</span>
            </div>
        </div>
    </div>

    <div class="alerts-panel glass-panel">
        <div class="live-indicator">
            <div class="live-dot"></div>
            <div class="live-text">Live Alerts</div>
        </div>
        <div id="alertsContainer"></div>
    </div>

    <div class="route-info glass-panel" id="routeInfo">
        <div class="route-header">
            <div class="search-title">Route Found</div>
            <div class="route-score" id="routeScore">92%</div>
        </div>
        <div class="route-stats">
            <div class="route-stat">
                <div class="route-stat-value" id="routeTime">14</div>
                <div class="route-stat-label">Minutes</div>
            </div>
            <div class="route-stat">
                <div class="route-stat-value" id="routeDistance">4.2</div>
                <div class="route-stat-label">Kilometers</div>
            </div>
        </div>
        <button class="btn-recalculate" onclick="recalculateRoute()">Recalculate Route</button>
    </div>

    <div class="legend glass-panel">
        <div class="legend-item">
            <div class="legend-dot danger"></div>
            <span>High Risk Zone</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot route"></div>
            <span>Safe Route</span>
        </div>
    </div>

    <script>
        // Initialize map centered on Bangalore
        const map = L.map('map').setView([12.9716, 77.5946], 13);
        
        // Add tile layer (dark theme)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // Risk zone data (mock data for Bangalore)
        const riskZones = [
            { lat: 12.9350, lng: 77.6250, radius: 400, risk: 'high', name: 'City Market' },
            { lat: 12.9850, lng: 77.5650, radius: 350, risk: 'high', name: 'Shivajinagar' },
            { lat: 12.9500, lng: 77.6100, radius: 300, risk: 'medium', name: 'Majestic' },
            { lat: 12.9200, lng: 77.5850, radius: 250, risk: 'medium', name: 'Kengeri' },
            { lat: 12.9600, lng: 77.5750, radius: 300, risk: 'high', name: 'Mallic' },
            { lat: 12.9150, lng: 77.6000, radius: 350, risk: 'medium', name: 'Benniganahalli' },
            { lat: 12.9900, lng: 77.5950, radius: 250, risk: 'medium', name: 'Jaynagar' },
            { lat: 12.9250, lng: 77.6200, radius: 300, risk: 'high', name: 'Gandhi Market' }
        ];

        // Store zone circles for animation
        let zoneCircles = [];
        let routePolyline = null;
        let navMarker = null;
        let routeMarkers = [];

        // Create risk zones on map
        function createRiskZones() {
            zoneCircles.forEach(circle => map.removeLayer(circle));
            zoneCircles = [];

            riskZones.forEach((zone, index) => {
                const color = zone.risk === 'high' ? '#ff006e' : '#ffbe0b';
                const opacity = zone.risk === 'high' ? 0.4 : 0.3;

                const circle = L.circle([zone.lat, zone.lng], {
                    radius: zone.radius,
                    color: color,
                    fillColor: color,
                    fillOpacity: opacity,
                    weight: 2,
                    className: 'danger-zone'
                }).addTo(map);

                circle.bindTooltip(zone.name + ' - ' + zone.risk.toUpperCase() + ' RISK', {
                    className: 'risk-tooltip',
                    direction: 'top'
                });

                zoneCircles.push(circle);
            });
        }

        // Simulated route coordinates (avoiding risk zones)
        function generateSafeRoute(source, destination) {
            // Simplified mock route - starts at Koramangala and ends at MG Road
            const routeCoords = [
                [12.9352, 77.6244],  // Start (Koramangala)
                [12.9378, 77.6195],
                [12.9412, 77.6120],
                [12.9450, 77.6050],
                [12.9500, 77.5980],
                [12.9545, 77.5920],
                [12.9580, 77.5870],
                [12.9610, 77.5810],
                [12.9645, 77.5755],
                [12.9680, 77.5700],  // End (MG Road)
            ];
            return routeCoords;
        }

        // Animate route drawing
        async function drawRoute(coords) {
            if (routePolyline) {
                map.removeLayer(routePolyline);
            }
            routeMarkers.forEach(m => map.removeLayer(m));
            routeMarkers = [];

            // Create route line progressively
            let accumulated = [];
            const speed = 50;

            for (let i = 0; i < coords.length; i++) {
                accumulated.push(coords[i]);
                
                if (routePolyline) {
                    map.removeLayer(routePolyline);
                }

                routePolyline = L.polyline(accumulated, {
                    color: '#00f5d4',
                    weight: 5,
                    opacity: 0.9,
                    className: 'route-line'
                }).addTo(map);

                await new Promise(r => setTimeout(r, speed));
            }

            // Add start marker
            const startIcon = L.divIcon({
                className: 'nav-marker-icon',
                html: '<div style="width:20px;height:20px;background:#00f5d4;border-radius:50%;border:3px solid #fff;box-shadow:0 0 15px #00f5d4;"></div>',
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });

            const startMarker = L.marker(coords[0], { icon: startIcon }).addTo(map);
            startMarker.bindPopup('<b>Start</b><br>Koramangala').openPopup();
            routeMarkers.push(startMarker);

            // Add end marker
            const endMarker = L.marker(coords[coords.length - 1], { icon: startIcon }).addTo(map);
            endMarker.bindPopup('<b>Destination</b><br>MG Road').openPopup();
            routeMarkers.push(endMarker);

            // Fit map to route
            const bounds = L.latLngBounds(coords);
            map.fitBounds(bounds, { padding: [50, 50] });
        }

        // Find and display route
        async function findRoute() {
            const btn = document.getElementById('findRoute');
            const source = document.getElementById('source').value;
            const dest = document.getElementById('destination').value;

            if (!source || !dest) {
                alert('Please enter both source and destination');
                return;
            }

            btn.classList.add('loading');

            // Simulate AI processing
            await new Promise(r => setTimeout(r, 1500));

            const routeCoords = generateSafeRoute(source, dest);
            await drawRoute(routeCoords);

            // Update stats
            const score = Math.floor(Math.random() * 15) + 85;
            const time = Math.floor(Math.random() * 10) + 10;
            const distance = (Math.random() * 3 + 2).toFixed(1);

            document.getElementById('safetyScoreValue').textContent = score + '%';
            document.getElementById('safetyProgress').style.width = score + '%';
            document.getElementById('routeScore').textContent = score + '%';
            document.getElementById('routeTime').textContent = time;
            document.getElementById('routeDistance').textContent = distance;

            // Update risk level color
            const riskEl = document.getElementById('riskLevelValue');
            const riskProgress = document.getElementById('riskProgress');
            if (score >= 80) {
                riskEl.textContent = 'LOW';
                riskEl.className = 'stat-value low';
                riskProgress.style.width = '10%';
            } else if (score >= 60) {
                riskEl.textContent = 'MEDIUM';
                riskEl.className = 'stat-value medium';
                riskProgress.style.width = '40%';
            } else {
                riskEl.textContent = 'HIGH';
                riskEl.className = 'stat-value high';
                riskProgress.style.width = '80%';
            }

            document.getElementById('routeInfo').classList.add('visible');
            btn.classList.remove('loading');

            // Add alert
            addAlert('Safe route calculated avoiding ' + riskZones.filter(z => z.risk === 'high').length + ' high-risk zones');
        }

        // Recalculate route
        function recalculateRoute() {
            // Clear existing route
            if (routePolyline) {
                map.removeLayer(routePolyline);
                routeMarkers.forEach(m => map.removeLayer(m));
            }

            // Randomly modify some risk zones
            riskZones.forEach((zone, i) => {
                if (Math.random() > 0.5) {
                    zone.lat += (Math.random() - 0.5) * 0.005;
                    zone.lng += (Math.random() - 0.5) * 0.005;
                }
            });

            createRiskZones();
            findRoute();
        }

        // Add alert to feed
        let alertCount = 0;
        function addAlert(message) {
            const container = document.getElementById('alertsContainer');
            const alertDiv = document.createElement('div');
            alertDiv.className = 'alert-item new';
            alertDiv.innerHTML = message + '<div class="alert-time">' + new Date().toLocaleTimeString() + '</div>';
            container.insertBefore(alertDiv, container.firstChild);

            // Keep only last 5 alerts
            while (container.children.length > 5) {
                container.removeChild(container.lastChild);
            }

            alertCount++;
        }

        // Live update simulation
        function liveUpdate() {
            // Randomly change risk zone intensity
            riskZones.forEach((zone, i) => {
                if (Math.random() > 0.7) {
                    const levels = ['high', 'medium', 'low'];
                    const currentIndex = levels.indexOf(zone.risk);
                    if (currentIndex < 2 && Math.random() > 0.5) {
                        zone.risk = levels[currentIndex + 1];
                    }
                }
            });

            createRiskZones();

            // Add random alert
            const alerts = [
                'New risk detected in nearby area',
                'Risk zone activity updated',
                'Crowd density changed',
                'Route safety recalculated',
                '5G network optimizing route'
            ];
            addAlert(alerts[Math.floor(Math.random() * alerts.length)]);

            // Update safety score randomly
            const currentScore = parseInt(document.getElementById('safetyScoreValue').textContent);
            const newScore = Math.max(70, Math.min(98, currentScore + (Math.random() > 0.5 ? 1 : -1) * Math.floor(Math.random() * 5)));
            document.getElementById('safetyScoreValue').textContent = newScore + '%';
            document.getElementById('safetyProgress').style.width = newScore + '%';
        }

        // Initialize
        createRiskZones();

        // Start live updates
        setInterval(liveUpdate, 4000);

        // Initial alert
        setTimeout(() => {
            addAlert('System initialized - Monitoring active');
            addAlert('5G network connected');
        }, 1000);
    </script>
</body>
</html>
